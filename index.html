<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Raylib Web App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        canvas.emscripten {
            border: 1px solid #333;
            outline: none;
            image-rendering: optimizeQuality;
        }
    </style>
</head>

<body class="h-screen w-screen bg-gray-900 flex overflow-hidden">
    <!-- Side panel -->
    <div class="w-64 bg-gray-800 p-4 flex flex-col gap-4">
        <h2 class="text-white text-xl font-bold mb-4">Controls</h2>
        <button onclick="window.location.href='https://burakssen.com'"
            class="bg-gray-700 hover:bg-gray-600 text-white py-2 px-4 rounded">Go Back</button>
        <button class="bg-gray-700 hover:bg-gray-600 text-white py-2 px-4 rounded">Button 2</button>
        <button class="bg-gray-700 hover:bg-gray-600 text-white py-2 px-4 rounded">Button 3</button>
        <!-- Add more buttons here -->
    </div>

    <!-- Main canvas area -->
    <div class="flex-1 flex justify-center items-center relative">
        <canvas id="canvas" class="emscripten" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <script>
        // Configure the Emscripten Module before loading raylib
        var Module = {
            canvas: document.getElementById('canvas'),
            print: (text) => console.log(text),
            printErr: (text) => console.error(text),

            // Runs once the runtime and raylib are initialized
            onRuntimeInitialized() {
                console.log("Raylib WebAssembly initialized!");
                const width = Module._GetScreenWidth();
                const height = Module._GetScreenHeight();
                const canvas = Module.canvas;
                canvas.width = width;
                canvas.height = height;
            }
        };
    </script>

    {{{ SCRIPT }}}
</body>

</html>
