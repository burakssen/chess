<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Raylib Web App</title>
    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas.emscripten {
            outline: none;
            /* Better rendering for crispness */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            /* Control size via CSS for high-DPI */
            width: 1200px;
            height: 800px;
        }

        button {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <canvas id="canvas" class="emscripten" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <script>
        // Configure the Emscripten Module before loading chess.js
        var Module = {
            canvas: (function () {
                const canvas = document.getElementById('canvas');
                return canvas;
            })(),
            print: (text) => console.log(text),
            printErr: (text) => console.error(text),

            // This runs once the runtime and raylib are initialized
            onRuntimeInitialized() {
                console.log("Raylib WebAssembly initialized!");
                
                // Handle high-DPI scaling
                const dpr = window.devicePixelRatio || 1;
                const canvas = Module.canvas;
                
                // Get the size Raylib thinks it is
                const width = Module._GetScreenWidth();
                const height = Module._GetScreenHeight();
                
                // Update canvas attributes for physical pixels
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                
                // CSS size remains the logical size
                canvas.style.width = width + "px";
                canvas.style.height = height + "px";
            }
        };
    </script>

    {{{ SCRIPT }}}

    <button onclick="window.location.href='https://burakssen.com'">Go Back</button>
</body>

</html>
